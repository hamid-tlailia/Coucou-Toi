# Builds the Android APK on GitHub's servers — no computer or Expo account
# needed. Every run publishes the APK on the repository's Releases page:
#   https://github.com/<owner>/<repo>/releases/latest  →  CocoLove.apk
# Run it manually from the phone: Actions → "Android APK" → Run workflow.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, ccr-eba0f142-rqimll]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Server address baked into the app. Override with a repository variable API_URL.
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://coco-love-api.vercel.app' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/CocoLove.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CocoLove-apk
          path: CocoLove.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Coco Love — Android (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            📲 حمّل الملف **CocoLove.apk** من الأسفل وثبّته على هاتف أندرويد.
            الخادم: ${{ env.EXPO_PUBLIC_API_URL }}
          files: CocoLove.apk
