# One-click deploy of the API on Render (https://render.com) — free plan.
# Database: create a free Postgres on https://neon.tech and paste its
# connection string as DATABASE_URL when Render asks for it.
services:
  - type: web
    name: coco-love-api
    runtime: node
    rootDir: server
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PRIVATE_MODE
        value: "true"
      - key: STORE_TIMEZONE
        value: Africa/Tunis
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
